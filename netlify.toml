# Netlify build settings. Netlify reads this file automatically when the repo is connected.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Astro 7.4 requires Node >= 22.22.0 (see "engines" in package.json). 24 is the current LTS
  # line and matches local development.
  NODE_VERSION = "24"

# Astro puts a content hash in every file name under /_astro/ (CSS, JS, fonts, images), so a
# changed file always gets a new URL. Browsers can keep these for a year without re-checking.
# Everything else keeps Netlify's default (re-check on every visit), so new deploys show at once.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# One address for search engines: the Netlify subdomain redirects to the custom domain.
# Deploy previews (deploy-preview-N--seniordevnotes.netlify.app) have other host names and are
# not affected.
[[redirects]]
  from = "https://seniordevnotes.netlify.app/*"
  to = "https://seniordevnotes.in/:splat"
  status = 301
  force = true
