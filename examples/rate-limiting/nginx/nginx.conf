# Rate limiting at the edge with nginx's limit_req: a leaky bucket per client IP.
# Run it with test-nginx.sh, which starts nginx with this file and fires a burst at it.

worker_processes 1;
error_log logs/error.log notice;
pid logs/nginx.pid;
events { worker_connections 256; }

http {
    access_log off;

    # One bucket per client IP, refilling at 5 requests per second. 10 MB of shared memory
    # holds about 80,000 clients on a 64-bit machine; when it is full, the least recently
    # used client is forgotten.
    limit_req_zone $binary_remote_addr zone=api:10m rate=5r/s;

    # nginx answers 503 by default, which says "we are broken". 429 says "you are too fast".
    limit_req_status 429;
    limit_req_log_level notice;

    server {
        listen 127.0.0.1:8088;
        root html;

        location /api/ {
            # Let up to 10 requests above the rate through at once (nodelay) instead of
            # queueing them; the 11th excess request in a burst is rejected.
            limit_req zone=api burst=10 nodelay;
            # Serve a file rather than `return 200`: `return` runs before limit_req does,
            # so a location that only returns would never be rate limited at all.
        }
    }
}
