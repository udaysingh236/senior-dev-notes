# One nginx process playing all three roles in front of the demo backends.
# Run it with test-nginx.sh, which starts the backends and nginx for you.
worker_processes 1;
pid nginx.pid;
error_log error.log warn;   # relative to the -p prefix
events {}

http {
    access_log off;

    # Load balancer: a pool of two copies. Round robin is the default; one failure takes a
    # server out for 10 s (these are nginx's defaults, written out so you can see them).
    upstream orders {
        server 127.0.0.1:9001 max_fails=1 fail_timeout=10s;
        server 127.0.0.1:9002 max_fails=1 fail_timeout=10s;
    }
    upstream users {
        server 127.0.0.1:9003;
    }

    # API gateway: API key -> user, and a limit per user: a burst of 3, then 18 per minute.
    map $http_x_api_key $api_user {
        default    "";
        "key-asha" asha;
        "key-ravi" ravi;
    }
    limit_req_zone $api_user zone=per_user:1m rate=18r/m;   # one every ~3.3 s
    limit_req_status 429;

    server {
        listen 127.0.0.1:8080;

        # Reverse proxy: overwrite, don't append, the client's X-Forwarded-For.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-User $api_user;

        location /orders/ {
            if ($api_user = "") { return 401 '{"error":"missing or unknown API key"}\n'; }
            limit_req zone=per_user burst=2 nodelay;
            proxy_pass http://orders;
        }
        location /users/ {
            if ($api_user = "") { return 401 '{"error":"missing or unknown API key"}\n'; }
            limit_req zone=per_user burst=2 nodelay;
            proxy_pass http://users;
        }
        error_page 429 = @limited;
        location @limited {
            return 429 '{"error":"rate limit: 3 at once, then 1 per 3.3 s"}\n';
        }
        location / {
            return 404 '{"error":"no route"}\n';
        }
    }
}
